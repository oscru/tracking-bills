<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  :root{--bg:#F6F7F9;--surface:#FFFFFF;--ink:#1A1D21;--ink2:#6B7280;--ink3:#9CA3AF;--line:#EDEFF2;--accent:#1A1D21; --lime:#B9F227; --lime-ink:#4D7C0F;--tint:#F2FBDC;--danger:#E5484D}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .screen{width:390px;min-height:844px;background:var(--bg);position:relative;display:flex;flex-direction:column;gap:16px;padding:20px 20px 96px}
  .h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
  .card{background:var(--surface);border-radius:18px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06)}
  .row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .rt{width:34px;height:34px;border-radius:10px;background:var(--tint);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .btn-sec{height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;background:#F1F2F4;color:var(--ink)}
  .tabbar{height:64px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;position:absolute;left:0;right:0;bottom:0}
  .tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--ink3)}
  .tab.on{color:var(--ink);font-weight:600}.tab.on::after{content:"";position:absolute;bottom:-8px;width:20px;height:3px;border-radius:2px;background:var(--lime)}
  .chev{margin-left:auto}
</style>
</helmet>

<div class="screen">

  <h1 class="h1">Ajustes</h1>

  <div class="card" style="display:flex;align-items:center;gap:14px;padding:16px">
    <div style="width:46px;height:46px;border-radius:999px;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700">N</div>
    <div style="flex:1">
      <div style="font-size:16px;font-weight:600">Nicolás</div>
      <div style="font-size:13px;color:var(--ink2)">nicolas@correo.com</div>
    </div>
    <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4C8CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </div>

  <div class="card">
    <div class="row">
      <div class="rt"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4D7C0F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h3"/></svg></div>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">Cuentas</div><div style="font-size:13px;color:var(--ink2)">3 activas</div></div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4C8CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="row">
      <div class="rt"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4D7C0F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 12 4l8 8v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><circle cx="9.5" cy="9.5" r="1.4"/></svg></div>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">Categorías</div><div style="font-size:13px;color:var(--ink2)">5 propias + predeterminadas</div></div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4C8CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="row">
      <div class="rt"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4D7C0F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9 10h6M9 14h6"/></svg></div>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">Moneda</div></div>
      <span style="font-size:14px;color:var(--ink2)">MXN</span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4C8CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="row">
      <div class="rt"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4D7C0F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z"/></svg></div>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">Tema</div></div>
      <span style="font-size:14px;color:var(--ink2)">Sistema</span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4C8CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>

  <div style="flex:1"></div>
  <div class="btn-sec">Cerrar sesión</div>

  <div class="tabbar">
    <div class="tab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>Inicio</div>
    <div class="tab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h13l-3-3"/><path d="M17 16H4l3 3"/></svg>Movimientos</div>
    <div class="tab on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11"/><path d="M4 17h7"/><circle cx="18" cy="7" r="2.4"/><circle cx="14" cy="17" r="2.4"/></svg>Ajustes</div>
  </div>

</div>
</x-dc>
</body>
</html>
