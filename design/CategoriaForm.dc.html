<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  :root{--bg:#F6F7F9;--surface:#FFFFFF;--ink:#1A1D21;--ink2:#6B7280;--ink3:#9CA3AF;--line:#EDEFF2;--accent:#1A1D21; --lime:#B9F227; --lime-ink:#4D7C0F;--danger:#E5484D}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .screen{width:390px;min-height:740px;background:var(--bg);display:flex;flex-direction:column;gap:20px;padding:20px}
  .h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
  .label{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:8px;display:block}
  .field{height:52px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;align-items:center;padding:0 14px;font-size:16px;color:var(--ink)}
  .chip{height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;padding:0 16px;font-size:13px;font-weight:500;color:var(--ink2)}
  .chip.sel{background:var(--lime);border-color:var(--lime);color:var(--ink)}
  .sw{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center}
  .sw.on{outline:2px solid var(--ink);outline-offset:2px}
  .btn{height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;background:var(--accent);color:#fff}
</style>
</helmet>

<div class="screen">

  <div style="display:flex;align-items:center;justify-content:space-between">
    <h1 class="h1">Nueva categoría</h1>
    <span style="font-size:14px;color:var(--ink2)">Cancelar</span>
  </div>

  <div>
    <span class="label">Nombre</span>
    <div class="field">Mascotas</div>
  </div>

  <div>
    <span class="label">Tipo</span>
    <div style="display:flex;gap:8px">
      <span class="chip sel">Gasto</span>
      <span class="chip">Ingreso</span>
    </div>
  </div>

  <div>
    <span class="label">Categoría superior (opcional)</span>
    <div class="field" style="justify-content:space-between">
      <span style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:999px;background:#22C55E"></span>Comida</span>
      <span style="font-size:13px;color:var(--ink3)">Cambiar ›</span>
    </div>
    <span style="font-size:12px;color:var(--ink3);margin-top:6px;display:block">Si eliges una, "Mascotas" será subcategoría (hereda el tipo).</span>
  </div>

  <div>
    <span class="label">Color</span>
    <div style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px">
      <span class="sw"><span style="width:24px;height:24px;border-radius:999px;background:#22C55E"></span></span>
      <span class="sw"><span style="width:24px;height:24px;border-radius:999px;background:#16A34A"></span></span>
      <span class="sw"><span style="width:24px;height:24px;border-radius:999px;background:#0D9488"></span></span>
      <span class="sw"><span style="width:24px;height:24px;border-radius:999px;background:#06B6D4"></span></span>
      <span class="sw"><span style="width:24px;height:24px;border-radius:999px;background:#0EA5E9"></span></span>
      <span class="sw"><span style="width:24px;height:24px;border-radius:999px;background:#3B82F6"></span></span>
      <span class="sw"><span style="width:24px;height:24px;border-radius:999px;background:#2563EB"></span></span>
      <span class="sw on"><span style="width:24px;height:24px;border-radius:999px;background:#8B5CF6"></span></span>
      <span class="sw"><span style="width:24px;height:24px;border-radius:999px;background:#A855F7"></span></span>
      <span class="sw"><span style="width:24px;height:24px;border-radius:999px;background:#EC4899"></span></span>
      <span class="sw"><span style="width:24px;height:24px;border-radius:999px;background:#F472B6"></span></span>
      <span class="sw"><span style="width:24px;height:24px;border-radius:999px;background:#EF4444"></span></span>
      <span class="sw"><span style="width:24px;height:24px;border-radius:999px;background:#F97316"></span></span>
      <span class="sw"><span style="width:24px;height:24px;border-radius:999px;background:#EAB308"></span></span>
      <span class="sw"><span style="width:24px;height:24px;border-radius:999px;background:#CA8A04"></span></span>
      <span class="sw"><span style="width:24px;height:24px;border-radius:999px;background:#64748B"></span></span>
    </div>
  </div>

  <div style="background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;gap:10px">
    <span style="width:10px;height:10px;border-radius:999px;background:#8B5CF6"></span>
    <span style="font-size:15px;font-weight:600">Mascotas</span>
    <span style="margin-left:auto;font-size:12px;color:var(--ink3)">Vista previa</span>
  </div>

  <div class="btn">Guardar</div>

</div>
</x-dc>
</body>
</html>
