<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  :root{--bg:#F6F7F9;--surface:#FFFFFF;--ink:#1A1D21;--ink2:#6B7280;--ink3:#9CA3AF;--line:#EDEFF2;--accent:#1A1D21; --lime:#B9F227; --lime-ink:#4D7C0F;--danger:#E5484D}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .screen{width:390px;min-height:760px;background:var(--bg);display:flex;flex-direction:column;gap:20px;padding:20px}
  .h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
  .label{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:8px;display:block}
  .field{height:52px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;align-items:center;padding:0 14px;font-size:16px;color:var(--ink)}
  .field.focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(185,242,39,.35)}
  .chip{height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;padding:0 14px;font-size:13px;font-weight:500;color:var(--ink2)}
  .chip.sel{background:var(--lime);border-color:var(--lime);color:var(--ink)}
  .btn{height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;background:var(--accent);color:#fff}
  .btn-sec{height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;background:#F1F2F4;color:var(--ink)}
</style>
</helmet>

<div class="screen">

  <div style="display:flex;align-items:center;justify-content:space-between">
    <h1 class="h1">Editar cuenta</h1>
    <span style="font-size:14px;color:var(--ink2)">Cancelar</span>
  </div>

  <div>
    <span class="label">Nombre</span>
    <div class="field focus">Ahorros BBVA</div>
  </div>

  <div>
    <span class="label">Tipo</span>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <span class="chip">Efectivo</span>
      <span class="chip sel">Banco</span>
      <span class="chip">Tarjeta de crédito</span>
    </div>
  </div>

  <div style="display:flex;gap:12px">
    <div style="width:120px">
      <span class="label">Moneda</span>
      <div class="field">MXN</div>
    </div>
    <div style="flex:1">
      <span class="label">Saldo inicial</span>
      <div class="field">$ 7,000.00</div>
    </div>
  </div>

  <div class="btn">Guardar cambios</div>

  <div style="border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:12px">
    <div class="btn-sec">Archivar</div>
    <div style="text-align:center;font-size:14px;font-weight:600;color:var(--danger)">Eliminar cuenta</div>
  </div>

</div>
</x-dc>
</body>
</html>
