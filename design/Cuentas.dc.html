<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  :root{--bg:#F6F7F9;--surface:#FFFFFF;--ink:#1A1D21;--ink2:#6B7280;--ink3:#9CA3AF;--line:#EDEFF2;--accent:#1A1D21; --lime:#B9F227; --lime-ink:#4D7C0F;--tint:#F2FBDC}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .screen{width:390px;min-height:720px;background:var(--bg);display:flex;flex-direction:column;gap:14px;padding:20px}
  .h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
  .back{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:4px}
  .card{background:var(--surface);border-radius:18px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06)}
  .row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .rt{width:36px;height:36px;border-radius:10px;background:var(--tint);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .tag{font-size:11px;font-weight:600;color:var(--ink3);background:#F1F2F4;border-radius:6px;padding:2px 6px}
</style>
</helmet>

<div class="screen">

  <div class="back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    Ajustes
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between">
    <h1 class="h1">Cuentas</h1>
    <span style="font-size:14px;font-weight:600;color:var(--accent)">Nueva</span>
  </div>

  <div class="card">
    <div class="row">
      <div class="rt"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4D7C0F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="12" cy="13" r="2.3"/></svg></div>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">Efectivo</div><div style="font-size:13px;color:var(--ink2)">Efectivo</div></div>
      <div style="font-size:15px;font-weight:700;letter-spacing:-.01em">$ 2,400.00</div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4C8CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="row">
      <div class="rt"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4D7C0F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10 12 4l8 6"/><path d="M5 10v9h14v-9M9 19v-5h6v5"/></svg></div>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">BBVA</div><div style="font-size:13px;color:var(--ink2)">Banco</div></div>
      <div style="font-size:15px;font-weight:700;letter-spacing:-.01em">$ 18,650.00</div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4C8CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="row">
      <div class="rt"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4D7C0F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg></div>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">Nu</div><div style="font-size:13px;color:var(--ink2)">Tarjeta de crédito</div></div>
      <div style="font-size:15px;font-weight:700;letter-spacing:-.01em">− $ 3,200.00</div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4C8CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="row">
      <div class="rt" style="background:#F1F2F4"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10 12 4l8 6"/><path d="M5 10v9h14v-9"/></svg></div>
      <div style="flex:1"><div style="font-size:15px;font-weight:600;color:var(--ink2)">Ahorro</div><div style="font-size:13px;color:var(--ink3);display:flex;align-items:center;gap:6px">Banco <span class="tag">archivada</span></div></div>
      <div style="font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink2)">$ 7,000.00</div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4C8CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
