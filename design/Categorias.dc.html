<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  :root{--bg:#F6F7F9;--surface:#FFFFFF;--ink:#1A1D21;--ink2:#6B7280;--ink3:#9CA3AF;--line:#EDEFF2;--accent:#1A1D21; --lime:#B9F227; --lime-ink:#4D7C0F}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .screen{width:390px;min-height:900px;background:var(--bg);display:flex;flex-direction:column;gap:14px;padding:20px}
  .h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
  .back{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:4px}
  .sec{font-size:13px;font-weight:600;color:var(--ink2);margin:8px 4px 0}
  .card{background:var(--surface);border-radius:18px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06)}
  .row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .subrow{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 40px;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink2)}
  .d{width:10px;height:10px;border-radius:999px;flex:0 0 auto}
  .subrow .d{width:6px;height:6px}
</style>
</helmet>

<div class="screen">

  <div class="back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    Ajustes
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between">
    <h1 class="h1">Categorías</h1>
    <span style="font-size:14px;font-weight:600;color:var(--accent)">Nueva</span>
  </div>

  <div class="sec">Gastos</div>
  <div class="card">
    <div class="row">
      <span class="d" style="background:#8B5CF6"></span>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">Mascotas</div></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C4C8CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="row">
      <span class="d" style="background:#22C55E"></span>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">Comida</div><div style="font-size:12px;color:var(--ink3)">Predeterminada · 3 subcategorías</div></div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C4C8CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="subrow"><span class="d" style="background:#22C55E"></span><span style="flex:1">Súper</span></div>
    <div class="subrow"><span class="d" style="background:#22C55E"></span><span style="flex:1">Restaurantes</span></div>
    <div class="subrow"><span class="d" style="background:#22C55E"></span><span style="flex:1">Café</span><span style="font-size:11px;color:var(--lime-ink)">tuya</span></div>
    <div class="row">
      <span class="d" style="background:#F59E0B"></span>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">Servicios</div><div style="font-size:12px;color:var(--ink3)">Predeterminada</div></div>
    </div>
    <div class="row">
      <span class="d" style="background:#3B82F6"></span>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">Transporte</div><div style="font-size:12px;color:var(--ink3)">Predeterminada · 2 subcategorías</div></div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C4C8CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="row">
      <span class="d" style="background:#EF4444"></span>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">Salud</div><div style="font-size:12px;color:var(--ink3)">Predeterminada</div></div>
    </div>
  </div>

  <div class="sec">Ingresos</div>
  <div class="card">
    <div class="row">
      <span class="d" style="background:#16A34A"></span>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">Salario</div><div style="font-size:12px;color:var(--ink3)">Predeterminada</div></div>
    </div>
    <div class="row">
      <span class="d" style="background:#2563EB"></span>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">Freelance</div><div style="font-size:12px;color:var(--ink3)">Predeterminada</div></div>
    </div>
    <div class="row">
      <span class="d" style="background:#059669"></span>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">Inversiones</div><div style="font-size:12px;color:var(--ink3)">Predeterminada</div></div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
