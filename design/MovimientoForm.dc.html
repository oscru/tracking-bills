<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  :root{--bg:#F6F7F9;--surface:#FFFFFF;--ink:#1A1D21;--ink2:#6B7280;--ink3:#9CA3AF;--line:#EDEFF2;--accent:#1A1D21; --lime:#B9F227; --lime-ink:#4D7C0F;--danger:#E5484D}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .screen{width:390px;min-height:880px;background:var(--bg);display:flex;flex-direction:column;gap:20px;padding:20px}
  .h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
  .label{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:8px;display:block}
  .seg{display:flex;background:#EEF0F2;border-radius:12px;padding:4px;gap:4px}
  .seg > div{flex:1;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink2)}
  .seg > div.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
  .close{width:34px;height:34px;border-radius:999px;background:#F1F2F4;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .chip{height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:8px;padding:0 13px;font-size:13px;font-weight:500;color:var(--ink2)}
  .chip .d{width:8px;height:8px;border-radius:999px}
  .chip.sel{color:#fff;border-color:transparent}
  .field{height:52px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:16px;color:var(--ink)}
  .btn{height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;background:var(--accent);color:#fff}
</style>
</helmet>

<div class="screen">

  <div style="display:flex;align-items:center;gap:12px">
    <div class="close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1D21" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
    <h1 class="h1">Nuevo movimiento</h1>
  </div>

  <div class="seg">
    <div class="on">Gasto</div>
    <div>Ingreso</div>
    <div>Transferencia</div>
  </div>

  <div style="background:var(--surface);border-radius:20px;box-shadow:0 1px 3px rgba(16,24,40,.06);padding:22px;text-align:center">
    <div class="label" style="text-align:center;margin-bottom:4px">Monto</div>
    <div style="font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1">$ 450<span style="color:var(--ink3)">.00</span></div>
  </div>

  <div>
    <span class="label">Categoría</span>
    <!-- fast path: a few recent chips (bounded, no infinite wrap) -->
    <div style="display:flex;gap:8px;overflow:hidden;margin-bottom:10px">
      <span class="chip sel" style="background:#22C55E"><span class="d" style="background:#fff"></span>Súper</span>
      <span class="chip"><span class="d" style="background:#F97316"></span>Restaurantes</span>
      <span class="chip"><span class="d" style="background:#3B82F6"></span>Uber</span>
      <span class="chip" style="color:var(--ink3)">···</span>
    </div>
    <!-- full path: opens the picker sheet -->
    <div class="field" style="cursor:pointer">
      <span style="display:flex;align-items:center;gap:8px"><span class="d" style="width:10px;height:10px;border-radius:999px;background:#22C55E"></span>Súper <span style="color:var(--ink3)">· Comida</span></span>
      <span style="font-size:13px;color:var(--lime-ink);font-weight:600">Ver todas ›</span>
    </div>
  </div>

  <div>
    <span class="label">Cuenta</span>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <span class="chip sel" style="background:var(--lime);color:#1A1D21">Efectivo</span>
      <span class="chip">BBVA</span>
      <span class="chip">Nu</span>
    </div>
  </div>

  <div>
    <span class="label">Descripción</span>
    <div class="field" style="color:var(--ink3)">Opcional</div>
  </div>

  <div>
    <span class="label">Fecha</span>
    <div class="field">
      <span>Hoy · 12 sep 2026</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    </div>
  </div>

  <div class="btn">Guardar</div>

  <div style="text-align:center;font-size:14px;font-weight:600;color:var(--danger)">Eliminar movimiento</div>

</div>
</x-dc>
</body>
</html>
