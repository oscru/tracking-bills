<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  :root{--surface:#FFFFFF;--ink:#1A1D21;--ink2:#6B7280;--ink3:#9CA3AF;--line:#EDEFF2;
    --lime:#B9F227;--lime-ink:#4D7C0F;--lime-tint:#F2FBDC}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
  .screen{width:390px;min-height:780px;background:rgba(16,19,23,.45);display:flex;flex-direction:column;justify-content:flex-end}
  .sheet{background:var(--surface);border-radius:24px 24px 0 0;padding:10px 0 20px;display:flex;flex-direction:column;gap:14px;max-height:700px}
  .handle{width:40px;height:4px;border-radius:2px;background:#E3E5E8;align-self:center;margin:2px 0 4px}
  .pad{padding:0 20px}
  .search{height:44px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:15px;color:var(--ink3)}
  .sec{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--ink3);text-transform:uppercase}
  .chip{height:34px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:7px;padding:0 12px;font-size:13px;font-weight:500;color:var(--ink2)}
  .chip.sel{background:var(--lime);border-color:var(--lime);color:var(--ink);font-weight:600}
  .d{width:8px;height:8px;border-radius:999px;flex:0 0 auto}
  .plist{display:flex;flex-direction:column;overflow:hidden}
  .prow{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--line)}
  .prow.parent .name{font-weight:700}
  .sub{display:flex;align-items:center;gap:10px;padding:9px 20px 9px 42px;font-size:14px;color:var(--ink2)}
  .sub .d{width:6px;height:6px}
  .caret{margin-left:auto;color:var(--ink3)}
</style>
</helmet>

<div class="screen">
  <div class="sheet">
    <div class="handle"></div>

    <div class="pad" style="display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:17px;font-weight:700">Categoría</span>
      <span style="font-size:13px;font-weight:600;color:var(--lime-ink)">+ Crear</span>
    </div>

    <div class="pad">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        Buscar categoría…
      </div>
    </div>

    <div class="pad" style="display:flex;flex-direction:column;gap:8px">
      <span class="sec">Frecuentes</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <span class="chip sel"><span class="d" style="background:#fff"></span>Súper</span>
        <span class="chip"><span class="d" style="background:#F97316"></span>Restaurantes</span>
        <span class="chip"><span class="d" style="background:#3B82F6"></span>Uber</span>
        <span class="chip"><span class="d" style="background:#8B5CF6"></span>Renta</span>
        <span class="chip"><span class="d" style="background:#EF4444"></span>Farmacia</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column">
      <span class="sec pad" style="margin-bottom:6px">Todas · gastos</span>
      <div class="plist">
        <div class="prow parent"><span class="d" style="background:#22C55E"></span><span class="name">Comida</span><svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
        <div class="sub"><span class="d" style="background:#22C55E"></span>Súper</div>
        <div class="sub"><span class="d" style="background:#22C55E"></span>Restaurantes</div>
        <div class="sub"><span class="d" style="background:#22C55E"></span>Café</div>

        <div class="prow parent"><span class="d" style="background:#3B82F6"></span><span class="name">Transporte</span><svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
        <div class="sub"><span class="d" style="background:#3B82F6"></span>Uber / taxi</div>
        <div class="sub"><span class="d" style="background:#3B82F6"></span>Gasolina</div>

        <div class="prow parent"><span class="d" style="background:#8B5CF6"></span><span class="name">Casa</span><svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
        <div class="prow parent"><span class="d" style="background:#EF4444"></span><span class="name">Salud</span><svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
        <div class="prow parent"><span class="d" style="background:#EAB308"></span><span class="name">Servicios</span><svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
      </div>
      <div style="font-size:12px;color:var(--ink3);padding:12px 20px 0">Toca un grupo para usarlo directo, o abre y elige subcategoría.</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
